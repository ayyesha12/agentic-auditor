version: "3.9"

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data:ro          # corpus and FAISS index (read-only)
      - ./logs:/app/logs              # shared with dashboard
    environment:
      - PYTHONUNBUFFERED=1

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile.dashboard
    ports:
      - "8501:8501"
    volumes:
      - ./logs:/app/logs              # reads from the same logs/ as the API
    depends_on:
      - api